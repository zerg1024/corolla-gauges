<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corolla XRS Gauge Suite</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --alert: #f85149;
      --success: #238636;
      --text: #c9d1d9;
      --subtext: #8b949e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.2rem; margin: 0; }
    h3 { font-size: 0.95rem; margin-top: 0; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); }
    .status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
      background-color: var(--border);
    }
    .status.connected { background-color: var(--success); color: #fff; }
    .status.connecting { background-color: #9e6a03; color: #fff; }
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 520px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-save { background-color: var(--success); }
    .btn-alert { background-color: var(--alert); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .metric {
      background-color: var(--bg);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .metric-val { font-size: 1.5rem; font-weight: bold; color: #fff; margin-top: 4px; }
    .metric-label { font-size: 0.75rem; color: var(--subtext); display: block; margin-bottom: 4px; }
    select, input[type="number"], input[type="range"] {
      width: 100%;
      padding: 8px;
      margin-top: 2px;
      background-color: var(--bg);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
    }
    .form-group { margin-bottom: 12px; }
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .toggle-group label { font-size: 0.85rem; }
    input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
  </style>
</head>
<body>

  <div class="header">
    <h1>Corolla XRS Suite</h1>
    <span id="status-badge" class="status">DISCONNECTED</span>
  </div>

  <div class="card">
    <button id="connect-btn" class="btn" onclick="connectGaugesBLE()">Connect via Bluetooth</button>
  </div>

  <!-- LIVE TELEMETRY READOUTS -->
  <div class="card">
    <h3>Live Engine Data</h3>
    <div class="grid">
      <div class="metric"><span class="metric-label">RPM</span><div id="val-rpm" class="metric-val">--</div></div>
      <div class="metric"><span class="metric-label">SPEED</span><div id="val-speed" class="metric-val">--</div></div>
      <div class="metric"><span class="metric-label">COOLANT</span><div id="val-coolant" class="metric-val">--</div></div>
      <div class="metric"><span class="metric-label">BOOST / VAC</span><div id="val-boost" class="metric-val">--</div></div>
      <div class="metric"><span class="metric-label">TRANS TEMP</span><div id="val-trans" class="metric-val">--</div></div>
      <div class="metric"><span class="metric-label">AIR/FUEL RATIO</span><div id="val-afr" class="metric-val">--</div></div>
    </div>
  </div>

  <!-- LEFT SCREEN CONFIGURATION -->
  <div class="card">
    <h3>Left Screen Setup</h3>
    <div class="grid">
      <div class="form-group">
        <label class="metric-label">Target PID</label>
        <select id="s1-pid" onchange="sendPreview()">
          <option value="0">RPM</option>
          <option value="1">Speed</option>
          <option value="2">Coolant Temp</option>
          <option value="3">Intake Air Temp</option>
          <option value="4">Throttle %</option>
          <option value="5">Engine Load</option>
          <option value="6" selected>Trans Temp</option>
          <option value="7">Boost / Vacuum</option>
          <option value="8">Fuel Level</option>
          <option value="9">Gear Position</option>
          <option value="10">Drag Timers</option>
          <option value="11">Air/Fuel Ratio</option>
          <option value="12">Ignition Timing</option>
          <option value="13">Horsepower</option>
          <option value="14">Torque</option>
        </select>
      </div>
      <div class="form-group">
        <label class="metric-label">Gauge Style</label>
        <select id="s1-style" onchange="sendPreview()">
          <option value="0">Analog Arc</option>
          <option value="1">Digital Bar</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label class="metric-label">Rotation</label>
        <select id="s1-rotation" onchange="sendPreview()">
          <option value="1">Landscape 0°</option>
          <option value="3">Flipped 180°</option>
        </select>
      </div>
      <div class="form-group">
        <label class="metric-label">Sweep Angle</label>
        <select id="s1-sweep" onchange="sendPreview()">
          <option value="200">200 Degrees</option>
          <option value="180">180 Degrees</option>
        </select>
      </div>
    </div>

    <div class="grid-3">
      <div class="form-group">
        <label class="metric-label">Max Val</label>
        <input type="number" id="s1-max" value="260" onchange="sendPreview()">
      </div>
      <div class="form-group">
        <label class="metric-label">Warn Val</label>
        <input type="number" id="s1-warn" value="210" onchange="sendPreview()">
      </div>
      <div class="form-group">
        <label class="metric-label">Crit Val</label>
        <input type="number" id="s1-crit" value="230" onchange="sendPreview()">
      </div>
    </div>
  </div>

  <!-- RIGHT SCREEN CONFIGURATION -->
  <div class="card">
    <h3>Right Screen Setup</h3>
    <div class="grid">
      <div class="form-group">
        <label class="metric-label">Target PID</label>
        <select id="s2-pid" onchange="sendPreview()">
          <option value="0">RPM</option>
          <option value="1">Speed</option>
          <option value="2" selected>Coolant Temp</option>
          <option value="3">Intake Air Temp</option>
          <option value="4">Throttle %</option>
          <option value="5">Engine Load</option>
          <option value="6">Trans Temp</option>
          <option value="7">Boost / Vacuum</option>
          <option value="8">Fuel Level</option>
          <option value="9">Gear Position</option>
          <option value="10">Drag Timers</option>
          <option value="11">Air/Fuel Ratio</option>
          <option value="12">Ignition Timing</option>
          <option value="13">Horsepower</option>
          <option value="14">Torque</option>
        </select>
      </div>
      <div class="form-group">
        <label class="metric-label">Gauge Style</label>
        <select id="s2-style" onchange="sendPreview()">
          <option value="0">Analog Arc</option>
          <option value="1">Digital Bar</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label class="metric-label">Rotation</label>
        <select id="s2-rotation" onchange="sendPreview()">
          <option value="3">Flipped 180°</option>
          <option value="1">Landscape 0°</option>
        </select>
      </div>
      <div class="form-group">
        <label class="metric-label">Sweep Angle</label>
        <select id="s2-sweep" onchange="sendPreview()">
          <option value="200">200 Degrees</option>
          <option value="180">180 Degrees</option>
        </select>
      </div>
    </div>

    <div class="grid-3">
      <div class="form-group">
        <label class="metric-label">Max Val</label>
        <input type="number" id="s2-max" value="260" onchange="sendPreview()">
      </div>
      <div class="form-group">
        <label class="metric-label">Warn Val</label>
        <input type="number" id="s2-warn" value="205" onchange="sendPreview()">
      </div>
      <div class="form-group">
        <label class="metric-label">Crit Val</label>
        <input type="number" id="s2-crit" value="225" onchange="sendPreview()">
      </div>
    </div>
  </div>

  <!-- SYSTEM & DISPLAY CONTROLS -->
  <div class="card">
    <h3>Cluster & Shift Controls</h3>
    <div class="toggle-group">
      <label for="demo-mode">Demo Sweep Mode</label>
      <input type="checkbox" id="demo-mode" onchange="sendPreview()">
    </div>
    
    <div class="form-group">
      <label class="metric-label">Shift Light RPM Threshold (<span id="rpm-val">6200</span> RPM)</label>
      <input type="range" id="shift-rpm" min="4000" max="8500" step="100" value="6200" oninput="document.getElementById('rpm-val').innerText=this.value" onchange="sendPreview()">
    </div>

    <div class="form-group">
      <label class="metric-label">Display Brightness (<span id="bright-val">100</span>%)</label>
      <input type="range" id="brightness" min="10" max="100" value="100" oninput="document.getElementById('bright-val').innerText=this.value" onchange="sendPreview()">
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="card grid">
    <button class="btn btn-save" onclick="sendAction('save')">Save to Flash Memory</button>
    <button class="btn btn-alert" onclick="sendAction('reset_peaks')">Reset Peak Needles</button>
  </div>

  <script>
    const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const TX_UUID      = "19b10001-e8f2-537e-4f6c-d104768a1214";
    const RX_UUID      = "19b10002-e8f2-537e-4f6c-d104768a1214";

    let bluetoothDevice = null;
    let rxCharacteristic = null;

    window.addEventListener('DOMContentLoaded', async () => {
      if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
      try {
        const devices = await navigator.bluetooth.getDevices();
        const pairedDevice = devices.find(d => d.name === 'Corolla-Dual-Gauges' || d.id === localStorage.getItem('last_ble_id'));
        if (pairedDevice) {
          updateStatus("CONNECTING...", "connecting");
          await setupDeviceConnection(pairedDevice);
        }
      } catch (err) {
        updateStatus("DISCONNECTED", "");
      }
    });

    async function connectGaugesBLE() {
      try {
        updateStatus("SCANNING...", "connecting");
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });
        if (device.id) localStorage.setItem('last_ble_id', device.id);
        await setupDeviceConnection(device);
      } catch (err) {
        updateStatus("DISCONNECTED", "");
        alert("BLE Connection Error: " + err.message);
      }
    }

    async function setupDeviceConnection(device) {
      bluetoothDevice = device;
      bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

      const server = await bluetoothDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);

      // Subscribe to live telemetry notifications
      const txChar = await service.getCharacteristic(TX_UUID);
      await txChar.startNotifications();
      txChar.addEventListener('characteristicvaluechanged', (event) => {
        const decoder = new TextDecoder('utf-8');
        const data = JSON.parse(decoder.decode(event.target.value));
        
        document.getElementById('val-rpm').innerText = data.rpm || 0;
        document.getElementById('val-speed').innerText = (data.speed || 0) + " MPH";
        document.getElementById('val-coolant').innerText = (data.coolant || 0) + " °F";
        document.getElementById('val-boost').innerText = (data.boost || 0).toFixed(1) + " PSI";
        document.getElementById('val-trans').innerText = (data.trans || 0) + " °F";
        document.getElementById('val-afr').innerText = (data.afr || 0).toFixed(1);
      });

      rxCharacteristic = await service.getCharacteristic(RX_UUID);
      updateStatus("CONNECTED", "connected");
      document.getElementById('connect-btn').innerText = "Gauges Paired";

      sendTimeSync();
    }

    function onDisconnected() {
      updateStatus("DISCONNECTED", "");
      document.getElementById('connect-btn').innerText = "Reconnect Gauges";
      rxCharacteristic = null;
    }

    function updateStatus(text, className) {
      const badge = document.getElementById('status-badge');
      badge.innerText = text;
      badge.className = "status " + className;
    }

    async function sendPreview() {
      if (!rxCharacteristic) return;

      const payload = {
        action: "preview",
        demoMode: document.getElementById('demo-mode').checked,
        brightness: parseInt(document.getElementById('brightness').value),
        shiftRpmThreshold: parseFloat(document.getElementById('shift-rpm').value),
        s1: {
          pid: parseInt(document.getElementById('s1-pid').value),
          style: parseInt(document.getElementById('s1-style').value),
          rotation: parseInt(document.getElementById('s1-rotation').value),
          sweepAngle: parseInt(document.getElementById('s1-sweep').value),
          maxVal: parseFloat(document.getElementById('s1-max').value),
          warnVal: parseFloat(document.getElementById('s1-warn').value),
          critVal: parseFloat(document.getElementById('s1-crit').value)
        },
        s2: {
          pid: parseInt(document.getElementById('s2-pid').value),
          style: parseInt(document.getElementById('s2-style').value),
          rotation: parseInt(document.getElementById('s2-rotation').value),
          sweepAngle: parseInt(document.getElementById('s2-sweep').value),
          maxVal: parseFloat(document.getElementById('s2-max').value),
          warnVal: parseFloat(document.getElementById('s2-warn').value),
          critVal: parseFloat(document.getElementById('s2-crit').value)
        }
      };

      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(JSON.stringify(payload)));
        console.log("Preview packet sent:", payload);
      } catch (err) {
        console.error("Preview Write Error:", err);
      }
    }

    async function sendAction(actionName) {
      if (!rxCharacteristic) return;
      const payload = JSON.stringify({ action: actionName });
      const encoder = new TextEncoder();
      await rxCharacteristic.writeValue(encoder.encode(payload));
      if (actionName === 'save') alert('Settings permanently saved to ESP32 Flash Memory!');
    }

    async function sendTimeSync() {
      if (!rxCharacteristic) return;
      const epochSecs = Math.floor(Date.now() / 1000);
      const payload = JSON.stringify({ action: "sync_time", epoch: epochSecs });
      const encoder = new TextEncoder();
      await rxCharacteristic.writeValue(encoder.encode(payload));
    }
  </script>
</body>
</html>
