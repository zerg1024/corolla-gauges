<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corolla XRS Gauge Suite</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --alert: #f85149;
      --text: #c9d1d9;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.2rem; margin: 0; }
    .status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
      background-color: var(--border);
    }
    .status.connected { background-color: #238636; color: #fff; }
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 480px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .metric {
      background-color: var(--bg);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .metric-val { font-size: 1.6rem; font-weight: bold; color: #fff; margin-top: 4px; }
    .metric-label { font-size: 0.75rem; color: #8b949e; }
    select {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      background-color: var(--bg);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Corolla XRS Dashboard</h1>
    <span id="status-badge" class="status">DISCONNECTED</span>
  </div>

  <div class="card">
    <button id="connect-btn" class="btn" onclick="connectGaugesBLE()">Connect via Bluetooth</button>
  </div>

  <div class="card">
    <h3>Live Telemetry Stream</h3>
    <div class="grid">
      <div class="metric">
        <div class="metric-label">RPM</div>
        <div id="val-rpm" class="metric-val">--</div>
      </div>
      <div class="metric">
        <div class="metric-label">SPEED</div>
        <div id="val-speed" class="metric-val">--</div>
      </div>
      <div class="metric">
        <div class="metric-label">COOLANT TEMP</div>
        <div id="val-coolant" class="metric-val">--</div>
      </div>
      <div class="metric">
        <div class="metric-label">BOOST / VAC</div>
        <div id="val-boost" class="metric-val">--</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Screen PID Selectors</h3>
    <label class="metric-label">Left Screen PID</label>
    <select id="left-pid" onchange="sendConfig()">
      <option value="0">Engine RPM</option>
      <option value="1">Vehicle Speed</option>
      <option value="2">Coolant Temperature</option>
      <option value="7" selected>Boost / Vacuum</option>
    </select>

    <br><br>

    <label class="metric-label">Right Screen PID</label>
    <select id="right-pid" onchange="sendConfig()">
      <option value="0">Engine RPM</option>
      <option value="2" selected>Coolant Temperature</option>
      <option value="6">Transmission Temp</option>
      <option value="5">Air/Fuel Ratio</option>
    </select>
  </div>

  <div class="card">
    <button class="btn" style="background-color: var(--alert);" onclick="sendAction('reset_peaks')">Reset Peak Hold Needles</button>
  </div>

  <script>
    const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const TX_UUID      = "19b10001-e8f2-537e-4f6c-d104768a1214";
    const RX_UUID      = "19b10002-e8f2-537e-4f6c-d104768a1214";

    let rxCharacteristic = null;

    async function connectGaugesBLE() {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Corolla-Dual-Gauges' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        // Receive Telemetry
        const txChar = await service.getCharacteristic(TX_UUID);
        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', (event) => {
          const decoder = new TextDecoder('utf-8');
          const data = JSON.parse(decoder.decode(event.target.value));
          
          document.getElementById('val-rpm').innerText = data.rpm || 0;
          document.getElementById('val-speed').innerText = (data.speed || 0) + " MPH";
          document.getElementById('val-coolant').innerText = (data.coolant || 0) + " °F";
          document.getElementById('val-boost').innerText = (data.boost || 0).toFixed(1) + " PSI";
        });

        // Write Channel
        rxCharacteristic = await service.getCharacteristic(RX_UUID);

        document.getElementById('status-badge').innerText = "CONNECTED";
        document.getElementById('status-badge').classList.add("connected");
        document.getElementById('connect-btn').innerText = "Gauges Paired";

      } catch (err) {
        console.error("BLE Connect Failed:", err);
        alert("BLE Connection Failed. Ensure you are using Bluefy browser on iOS.");
      }
    }

    async function sendConfig() {
      if (!rxCharacteristic) return;
      const s1 = parseInt(document.getElementById('left-pid').value);
      const s2 = parseInt(document.getElementById('right-pid').value);
      
      const payload = JSON.stringify({ s1_pid: s1, s2_pid: s2 });
      await rxCharacteristic.writeValue(new TextEncoder().encode(payload));
    }

    async function sendAction(actionName) {
      if (!rxCharacteristic) return;
      const payload = JSON.stringify({ action: actionName });
      await rxCharacteristic.writeValue(new TextEncoder().encode(payload));
    }
  </script>
</body>
</html>
